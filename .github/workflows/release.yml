name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # Main-branch releases are explicit: squash a PR with title "release: vX.Y.Z".
    # Manual v* tags remain supported. A release is only published after validation.
    if: "github.ref_type == 'tag' || startsWith(github.event.head_commit.message, 'release: v')"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Validate release version
        id: version
        shell: pwsh
        env:
          RELEASE_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          $packageVersion = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $packageVersion) { throw "Cargo.toml package version not found." }
          $version = $packageVersion.Matches[0].Groups[1].Value
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -ne $tag) {
              throw "Git tag $env:GITHUB_REF_NAME disagrees with Cargo.toml ($tag)."
            }
          } elseif (-not $env:RELEASE_COMMIT_MESSAGE.StartsWith("release: $tag")) {
            throw "Main branch release commit must start with 'release: $tag'."
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Verify package
        run: cargo package --locked

      - name: Build Windows release
        run: cargo build --release --locked

      - name: Create SHA256 checksum
        shell: pwsh
        run: |
          $exe = "target/release/opencode-usage-monitor.exe"
          if (-not (Test-Path $exe)) { throw "Release executable is missing." }
          $sha256 = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          "$sha256  opencode-usage-monitor.exe" | Set-Content -Path opencode-usage-monitor.exe.sha256 -NoNewline -Encoding ascii

      - name: Prepare release notes
        id: notes
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $notes = "docs/releases/$tag.md"
          if (-not (Test-Path $notes)) {
            "OpenCode Usage Monitor $tag release. See the commit history for changes." |
              Set-Content -Path release-notes.md -Encoding utf8
            $notes = "release-notes.md"
          }
          "file=$notes" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: OpenCode Usage Monitor ${{ steps.version.outputs.tag }}
          body_path: ${{ steps.notes.outputs.file }}
          files: |
            target/release/opencode-usage-monitor.exe
            opencode-usage-monitor.exe.sha256
          fail_on_unmatched_files: true
          make_latest: true

# This fork has no registered WinGet package. Do not submit updates to the
# upstream publisher's WinGet package ID. In-app updates still require a
# trusted Authenticode signature, so unsigned fork releases are manual installs.
